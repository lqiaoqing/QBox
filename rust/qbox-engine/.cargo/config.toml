[build]
# 构建产物放到已忽略的 work 目录，避免污染工作区。
target-dir = "../../work/rust-target"

[target.x86_64-pc-windows-gnu]
# Windows 11 26200 的 kernel32 不再导出 WaitOnAddress；必须用 rust-mingw 自带的导入库。
linker = "D:\\Work\\workspace\\QBox-rust-engine\\rust\\qbox-engine\\gnu-linker.cmd"
rustflags = ["-C", "link-self-contained=yes"]
