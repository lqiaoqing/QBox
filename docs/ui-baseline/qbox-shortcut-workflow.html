      <div class="qw-editor-bar"><span>工作笔记.md — 文本编辑器</span><span>示例桌面</span></div>
      <div class="qw-editor-page">
        <h2>让工具随手可用</h2>
        <p>Keep your tools close, and stay in the flow.</p>
        <p>把常用工具放在触手可及的位置，让每一次复制、截图和查找，都能自然接着当前的工作。</p>
        <hr><h3>今天的工作</h3>
        <p>整理界面方案，确认快捷键与交互细节。</p>
        <div class="qw-editor-ghost"></div><div class="qw-editor-ghost short"></div>
      </div>
    </div>
    <div class="qw-soften"></div>
    <div id="qw-screen"></div>
    <div class="qw-toast" role="status" aria-live="polite" hidden></div>
  </div>
  <div class="qw-demo-foot"><span>交互预览 · 全部为示例数据，不操作系统剪贴板与文件</span><button class="cursor-interaction" type="button" data-action="settings">快捷键设置</button></div>
</div>
<script>
(() => {
  const root = document.getElementById('qbox-workflow');
  const screen = root.querySelector('#qw-screen');
  const stage = root.querySelector('.qw-stage');
  const message = root.querySelector('.qw-toast');
  const tools = [ ['search','搜索','search'], ['clipboard','剪贴板','clipboard-list'], ['capture','截图与贴图','scan-line'], ['desktop','桌面整理','layout-grid'], ['translate','快捷翻译','languages'] ];
  const shortcuts = {search:'双击 Ctrl',clipboard:'Ctrl + `',capture:'Ctrl + 1',translate:'Ctrl + 2',desktop:'未设置'};
  const defaults = {...shortcuts};
  const clips = [
    {id:'address',type:'text',title:'常用收件信息',body:'示例科技 · 产品设计组\n联系人：项目负责人\n地址：示例园区 A 座 3 层',source:'工作笔记',time:'常用内容',pin:true},
    {id:'build',type:'code',title:'cargo build --release',body:'cargo build --release',source:'终端',time:'常用命令',pin:true},
    {id:'note',type:'text',title:'让每一次复制、截图和查找，都能接着当前的工作。',body:'把常用工具放在触手可及的位置，让每一次复制、截图和查找，都能自然接着当前的工作。',source:'工作笔记',time:'刚刚',pin:false},
    {id:'image',type:'image',title:'界面方案 · 局部截图',body:'图片预览',source:'截图',time:'2 分钟前',pin:false},
    {id:'english',type:'text',title:'Keep your tools close, and stay in the flow.',body:'Keep your tools close, and stay in the flow.',source:'浏览器',time:'5 分钟前',pin:false},
    {id:'file',type:'file',title:'QBox 界面方案.fig',body:'QBox 界面方案.fig\n设计文档 · 2.4 MB\nD:\\Design\\QBox 界面方案.fig',source:'文件资源管理器',time:'8 分钟前',pin:false}
  ];
  const saved = window.openai?.widgetState?.privateContent || {};
  const state = {surface:['main','quick','closed'].includes(saved.surface)?saved.surface:'quick',tool:tools.some(t=>t[0]===saved.tool)?saved.tool:'clipboard',filter:'all',query:'',selected:'note',keep:false,source:'Keep your tools close, and stay in the flow.',translated:true,capturing:saved.tool==='capture'&&saved.surface==='quick',captureDone:false,captureStyle:'',annotation:false,recorder:null};
  let toastTimer;
  const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const button = (text,action,primary=false) => `<button class="qw-btn cursor-interaction ${primary?'qw-primary':''}" type="button" data-action="${action}">${text}</button>`;
  function save() {
    window.openai?.setWidgetState?.({modelContent:{direction:'Windows 原生主界面与独立快捷面板',tool:state.tool,surface:state.surface},privateContent:{tool:state.tool,surface:state.surface}})?.catch(()=>{});
  }
  function toast(text) { clearTimeout(toastTimer); message.textContent=text; message.hidden=false; toastTimer=setTimeout(()=>message.hidden=true,3200); }
  function titlebar(title,quick=true) {
    return `<div class="qw-titlebar"><span class="qw-logo">Q</span><strong>${title}</strong><span class="qw-title-sub">${quick?'快捷面板':'工具随手可用'}</span><span class="qw-spacer"></span>${quick?`<button class="qw-icon cursor-interaction ${state.keep?'active':''}" type="button" aria-label="${state.keep?'取消保持打开':'保持面板打开'}" data-action="keep">${icon('pin')}</button><button class="qw-icon cursor-interaction" type="button" aria-label="在主界面打开" data-action="main">${icon('expand')}</button>`:''}<button class="qw-icon cursor-interaction" type="button" aria-label="收起窗口" data-action="close">${icon('x')}</button></div>`;
  }
  function visibleClips() {
    return clips.filter(c=>(state.filter==='all'||state.filter==='pin'&&c.pin||state.filter==='text'&&['text','code'].includes(c.type)||state.filter===c.type)&&(!state.query||(c.title+' '+c.body+' '+c.source).toLowerCase().includes(state.query.toLowerCase())));
  }
  function syncSelection() { const list=visibleClips();if(!list.some(c=>c.id===state.selected))state.selected=list[0]?.id||null; }
  function clipControls() {
    return `<div class="qw-quick-search"><label class="qw-input-wrap">${icon('search')}<input aria-label="搜索剪贴板记录" placeholder="搜索最近复制的内容" value="${escape(state.query)}"><kbd>Ctrl + F</kbd></label></div><div class="qw-filters" aria-label="剪贴板类型">${[['all','全部'],['text','文本'],['image','图片'],['file','文件'],['pin','置顶']].map(([id,label])=>`<button class="cursor-interaction" type="button" data-filter="${id}" aria-pressed="${state.filter===id}">${label}</button>`).join('')}</div>`;
  }
  function clipRows() {
    const visible=visibleClips();
    if (!visible.length) return '<div class="qw-empty">没有找到这条记录</div>';
    return [true,false].map(pinned=>{
      const group=visible.filter(c=>c.pin===pinned);
      return group.length?`<div class="qw-group">${pinned?icon('pin'):''}${pinned?'置顶':'最近复制'} <span>· ${group.length}</span></div>${group.map(c=>`<div class="qw-row ${state.selected===c.id?'selected':''}" data-row="${c.id}"><button class="qw-record cursor-interaction" type="button" data-select="${c.id}" aria-pressed="${state.selected===c.id}"><span class="qw-type">${c.type==='image'?'<span class="qw-thumb"></span>':icon({text:'text',code:'terminal',file:'file'}[c.type])}</span><span class="qw-record-body"><span class="qw-record-title" style="display:block" data-tooltip="${escape(c.title)}">${escape(c.title)}</span><span class="qw-meta"><span>${c.type==='image'?'1280 × 720':escape(c.source)}</span><span>·</span><span>${escape(c.time)}</span></span></span><span class="qw-number">${visible.indexOf(c)+1}</span></button><button class="qw-icon qw-pin cursor-interaction ${c.pin?'active':''}" type="button" data-pin="${c.id}" aria-label="${c.pin?'取消置顶':'置顶'} ${escape(c.title)}">${icon('pin')}</button></div>`).join('')}`:'';
    }).join('');
  }
  function clipDetail() {
    const c=clips.find(c=>c.id===state.selected)||clips[0];
    return `<div class="qw-detail"><div class="qw-detail-label">内容预览</div><h3>${escape(c.title)}</h3>${c.type==='image'?'<div class="qw-mini-capture"><strong>让工具随手可用</strong><p style="margin-top:12px;font-size:11px">Keep your tools close.</p></div>':c.type==='code'?`<pre>${escape(c.body)}</pre>`:`<div class="qw-detail-text">${escape(c.body)}</div>`}<span class="qw-detail-label">${escape(c.source)} · ${escape(c.time)}</span>${button(icon('copy')+'复制内容','copy',true)}</div>`;
  }
  function clipboard(quick) {
    if(quick) return `<section class="qw-surface qw-quick" aria-label="剪贴板快捷面板">${titlebar('剪贴板')}${clipControls()}<div class="qw-list">${clipRows()}</div><div class="qw-quick-foot"><span class="qw-foot-keys"><span>↑↓ 选择</span><span>Enter 粘贴</span><span>Shift + Enter 纯文本</span></span><span class="qw-target">${icon('corner-down-left')}返回工作笔记</span></div></section>`;
    return `<div class="qw-library"><div>${clipControls()}<div class="qw-list">${clipRows()}</div></div>${clipDetail()}</div>`;
  }
  function searchResults() {
    return `<div class="qw-result-list">${[['folder','产品资料','D:\\Documents\\产品资料'],['file-text','QBox 界面方案.md','D:\\Documents\\QBox 界面方案.md'],['file-text','快捷键设计说明.md','D:\\Documents\\快捷键设计说明.md']].filter(v=>!state.query||v[1].includes(state.query)).map(v=>`<button class="qw-result cursor-interaction" type="button" data-action="open-result">${icon(v[0])}<div>${escape(v[1])}<small>${escape(v[2])}</small></div>${icon('corner-down-left')}</button>`).join('')||'<div class="qw-empty">没有匹配的示例结果</div>'}</div>`;
  }
  function search(quick) {
    const content=`<label class="qw-search-box">${icon('search')}<input aria-label="搜索文件和应用" placeholder="搜索文件和应用" value="${escape(state.query)}">${quick?'<kbd>双击 Ctrl</kbd>':''}</label>${searchResults()}`;
    return quick?`<section class="qw-surface qw-quick qw-search-quick" aria-label="快捷搜索栏">${content}<div class="qw-quick-foot"><span>Enter 打开 · Esc 收起</span><span class="qw-target">再次双击 Ctrl → 完整搜索界面</span></div></section>`:`<div class="qw-placeholder" style="padding:0;display:block">${content}</div><p class="qw-note" style="margin-top:14px">在此预览文件、调整搜索范围与筛选条件。</p>`;
  }
  function translate(quick) {
    const content=`<div class="qw-translation"><div class="qw-languages"><label><span class="qw-note">原文 </span><select aria-label="原文语言"><option>自动检测</option><option>英语</option><option>中文</option></select></label>${icon('arrow-right')}<label><span class="qw-note">译文 </span><select aria-label="译文语言"><option>简体中文</option><option>English</option></select></label></div><textarea aria-label="待翻译文字" placeholder="输入或粘贴要翻译的文字">${escape(state.source)}</textarea><div class="qw-translate-output" aria-live="polite">${state.translated?'让工具触手可及，让工作行云流水。':'译文将在这里显示'}</div><div class="qw-translate-actions"><span class="qw-note">${state.translated?'示例译文':'支持输入与粘贴'}</span><div style="display:flex;gap:7px">${button(icon('copy')+'复制译文','copy-translation')}${button('翻译','translate-now',true)}</div></div></div>`;
    return quick?`<section class="qw-surface qw-quick" aria-label="翻译快捷面板">${titlebar('快捷翻译')}${content}<div class="qw-quick-foot"><span>Ctrl + Enter 翻译</span><span>Esc 收起 · 展开到主界面继续编辑</span></div></section>`:content;
  }
  function settings() {
    return `<div>${tools.map(([id,label,name])=>`<div class="qw-setting-row"><div class="qw-setting-title">${icon(name)}<div>${label}<small>${id==='search'?'快捷搜索栏 → 再次唤起进入主界面':id==='capture'?'直接开始屏幕选区':id==='desktop'?'可按需设置快捷键':'打开独立快捷面板'}</small></div></div><span class="qw-shortcut">${escape(shortcuts[id])}</span>${id==='search'?'<span class="qw-note">当前保持</span>':`<button class="qw-btn cursor-interaction" type="button" data-edit="${id}">修改</button>`}</div>`).join('')}<p class="qw-note" style="margin-top:17px">此处可演示自定义与内部重复检测；正式软件应同时显示系统注册结果。</p>${state.recorder?`<div class="qw-recorder"><label for="qw-hotkey">为${tools.find(t=>t[0]===state.recorder)[1]}按下新快捷键</label><input id="qw-hotkey" aria-label="录制快捷键" readonly placeholder="例如 Ctrl + Shift + V"><p class="qw-error" role="alert" hidden></p>${button('取消','cancel-record')}</div>`:''}<div style="margin-top:19px">${button('恢复默认快捷键','reset-keys')}</div></div>`;
  }
  function mainContent() {
    if(state.tool==='clipboard')return clipboard(false);
    if(state.tool==='search')return search(false);
    if(state.tool==='translate')return translate(false);
    if(state.tool==='settings')return settings();
    if(state.tool==='capture')return `<div class="qw-placeholder"><div class="qw-mini-capture"><strong>最近截图</strong><p class="qw-note" style="margin-top:14px">让工具触手可及，让工作行云流水。</p></div>${button(icon('scan-line')+'开始截图','capture-start',true)}<p class="qw-note">快捷键直接进入选区，完整界面管理历史截图与截图设置。</p></div>`;
    return `<div class="qw-placeholder"><h3 style="font-size:15px">桌面文件</h3>${[['folder','文档'],['image','图片'],['archive','压缩包']].map(([i,t])=>`<div class="qw-file-line">${icon(i)}${t}<span class="qw-spacer"></span><span class="qw-note">示例分组</span></div>`).join('')}${button('查看整理规则','desktop-rules')}<p class="qw-note">桌面整理的快捷键可按需设置。</p></div>`;
  }
  function main() {
    const tool=tools.find(t=>t[0]===state.tool);
    const label=tool?tool[1]:'快捷键';
    return `<section class="qw-surface qw-main" aria-label="QBox 主界面">${titlebar('QBox',false)}<div class="qw-main-grid"><nav class="qw-sidebar" aria-label="工具导航"><span class="qw-side-caption">工作空间</span>${tools.map(([id,label,i])=>`<button class="qw-nav cursor-interaction" type="button" data-nav="${id}" aria-pressed="${state.tool===id}">${icon(i)}${label}</button>`).join('')}<button class="qw-nav cursor-interaction" type="button" data-nav="settings" aria-pressed="${state.tool==='settings'}">${icon('settings-2')}快捷键设置</button></nav><main class="qw-content"><div class="qw-page-title"><div><h2>${label}</h2><p>${({clipboard:'最近复制的内容，随时接着用',search:'查找、预览和管理文件',translate:'阅读与表达，不打断思路',capture:'截图、标注与贴图',desktop:'让常用文件井然有序',settings:'为每个工具设置顺手的唤起方式'})[state.tool]}</p></div>${tool&&state.tool!=='desktop'?button((state.tool==='capture'?'开始截图':'快捷面板')+' <kbd>'+escape(shortcuts[state.tool])+'</kbd>','quick'):''}</div>${mainContent()}</main></div></section>`;
  }
  function capture() {
    return `<div class="qw-capture" aria-label="截图选区演示"><div class="qw-capture-hint"><span>${state.captureDone?'已选中区域':'自动识别：文本区域'}</span><span>${state.captureDone?'可标注、复制、贴图或翻译':'点击确认 · 拖动重新框选'}</span><button type="button" class="cursor-interaction" data-action="close" aria-label="退出截图">Esc 退出</button></div><div class="qw-selection"><span class="qw-dimensions">${state.captureDone?'已确认选区':'自动选区'}</span>${state.annotation?'<div class="qw-annotation"></div>':''}</div>${state.captureDone?`<div class="qw-capture-actions" aria-label="截图工具栏">${[['move-up-right','标注','annotate'],['scan-text','提取文字','ocr'],['languages','翻译','capture-translate'],['pin','贴图','pin-capture'],['download','保存','save-capture'],['copy','复制','copy-capture'],['refresh-cw','重选','reselect']].map(([i,t,a])=>`<button type="button" class="cursor-interaction" data-action="${a}">${icon(i)}${t}</button>`).join('')}</div>`:''}</div>`;
  }
  function render() {
    message.hidden=true;
    stage.querySelector('.qw-soften').hidden=state.capturing||state.surface==='closed';
    screen.innerHTML=state.capturing?capture():state.surface==='closed'?'':state.surface==='main'?main():state.tool==='search'?search(true):state.tool==='translate'?translate(true):clipboard(true);
    if(state.capturing&&state.captureStyle)screen.querySelector('.qw-selection').setAttribute('style',state.captureStyle);
    root.querySelectorAll('[data-trigger]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.trigger===state.tool&&state.surface!=='closed')));
    root.querySelector('[data-action=main]').setAttribute('aria-pressed',String(state.surface==='main'));
    root.querySelectorAll('[data-trigger]').forEach(b=>{if(b.dataset.trigger!=='search')b.querySelector('kbd').textContent=shortcuts[b.dataset.trigger];});
    if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});
    if(state.recorder)screen.querySelector('#qw-hotkey')?.focus();
  }
  function activate(tool) {
    state.recorder=null;
    if(state.tool!==tool)state.query='';
    if(tool==='capture'){state.tool=tool;state.capturing=true;state.captureDone=false;state.captureStyle='';state.annotation=false;state.surface='quick';}
    else if(tool==='search'){
      const promote=state.tool==='search'&&state.surface==='quick'&&!state.capturing;
      state.tool='search';state.surface=promote?'main':'quick';state.capturing=false;
    }else{
      const close=state.tool===tool&&state.surface==='quick'&&!state.capturing;
      state.tool=tool;state.surface=close?'closed':'quick';state.capturing=false;
    }
    render();save();
  }
  // 粘贴只更新演示提示，避免预览页面接触系统剪贴板或真实窗口。
  function paste(plain=false) { const c=clips.find(c=>c.id===state.selected);if(!c)return;if(!state.keep){state.surface='closed';render();}toast(`已模拟${plain?'纯文本':''}粘贴到工作笔记：${c.title.slice(0,24)}`); }
  root.addEventListener('click',event=>{
    const target=event.target.closest('button');if(!target)return;
    if(target.dataset.trigger){activate(target.dataset.trigger);return;}
    if(target.dataset.nav){state.tool=target.dataset.nav;state.query='';state.filter='all';state.recorder=null;render();save();return;}
    if(target.dataset.select){state.selected=target.dataset.select;screen.querySelectorAll('[data-row]').forEach(row=>{const selected=row.dataset.row===state.selected;row.classList.toggle('selected',selected);row.querySelector('[data-select]').setAttribute('aria-pressed',String(selected));});const detail=screen.querySelector('.qw-detail');if(detail){detail.outerHTML=clipDetail();if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});}return;}
    if(target.dataset.pin){const c=clips.find(c=>c.id===target.dataset.pin);c.pin=!c.pin;render();return;}
    if(target.dataset.filter){state.filter=target.dataset.filter;syncSelection();render();return;}
    if(target.dataset.edit){state.recorder=target.dataset.edit;render();return;}
    const action=target.dataset.action;
    if(action==='main'){state.surface='main';state.capturing=false;if(state.tool==='settings')state.tool='clipboard';render();save();}
    else if(action==='settings'){state.surface='main';state.tool='settings';state.capturing=false;render();save();}
    else if(action==='close'){state.surface='closed';state.capturing=false;render();save();}
    else if(action==='keep'){state.keep=!state.keep;render();}
    else if(action==='quick'){if(state.tool==='capture')activate('capture');else {state.surface='quick';render();save();}}
    else if(action==='copy')toast('已模拟复制选中内容');
    else if(action==='copy-translation')toast(state.translated?'已模拟复制译文':'请先完成翻译');
    else if(action==='translate-now'){if(!state.source.trim()){toast('请输入需要翻译的文字');return;}state.translated=true;render();}
    else if(action==='open-result')toast('已模拟打开文件');
    else if(action==='capture-start')activate('capture');
    else if(action==='reselect'){state.captureDone=false;state.captureStyle='';render();}
    else if(action==='annotate'){state.annotation=!state.annotation;render();}
    else if(action==='capture-translate'){state.capturing=false;state.tool='translate';state.surface='quick';state.source='Keep your tools close, and stay in the flow.';state.translated=true;render();save();}
    else if(action==='ocr')toast('示例识别结果：Keep your tools close, and stay in the flow.');
    else if(action==='pin-capture')toast('已模拟贴图，可在当前工作旁对照查看');
    else if(action==='save-capture')toast('已模拟保存截图');
    else if(action==='copy-capture'){state.capturing=false;state.surface='closed';render();toast('已模拟复制截图，返回当前工作');}
    else if(action==='reset-keys'){Object.assign(shortcuts,defaults);state.recorder=null;render();toast('已恢复演示默认快捷键');}
    else if(action==='cancel-record'){state.recorder=null;render();}
    else if(action==='desktop-rules')toast('建议在此配置分类规则、目标文件夹与整理预览');
  });
  root.addEventListener('dblclick',event=>{if(event.target.closest('[data-select]'))paste();});
  root.addEventListener('input',event=>{
    if(event.target.matches('input[aria-label="搜索剪贴板记录"]')){state.query=event.target.value;syncSelection();screen.querySelector('.qw-list').innerHTML=clipRows();const detail=screen.querySelector('.qw-detail');if(detail)detail.outerHTML=clipDetail();if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});}
    if(event.target.matches('input[aria-label="搜索文件和应用"]')){state.query=event.target.value;screen.querySelector('.qw-result-list').outerHTML=searchResults();if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});}
    if(event.target.matches('textarea')){state.source=event.target.value;state.translated=false;screen.querySelector('.qw-translate-output').textContent='译文将在这里显示';}
  });
  root.addEventListener('keydown',event=>{
    if(event.target.id==='qw-hotkey'){
      event.preventDefault();if(['Control','Shift','Alt','Meta'].includes(event.key))return;
      const warning=screen.querySelector('.qw-error');
      if(!event.ctrlKey&&!event.altKey&&!event.metaKey){warning.hidden=false;warning.textContent='请同时按下 Ctrl 或 Alt 等组合键';return;}
      const key=[event.ctrlKey?'Ctrl':null,event.altKey?'Alt':null,event.shiftKey?'Shift':null,event.metaKey?'Win':null,event.key.length===1?event.key.toUpperCase():event.key].filter(Boolean).join(' + ');
      const conflict=Object.entries(shortcuts).find(([id,value])=>id!==state.recorder&&value.toLowerCase()===key.toLowerCase());
      if(conflict){warning.hidden=false;warning.textContent='与'+tools.find(t=>t[0]===conflict[0])[1]+'的快捷键重复';return;}
      shortcuts[state.recorder]=key;state.recorder=null;render();toast('已更新演示快捷键，未注册系统热键');return;
    }
    if(event.key==='Escape'){state.surface='closed';state.capturing=false;render();save();return;}
    if(state.tool==='clipboard'&&state.surface!=='closed'&&!state.capturing){
      if(event.ctrlKey&&event.key.toLowerCase()==='f'){event.preventDefault();screen.querySelector('input')?.focus();return;}
      if(['ArrowDown','ArrowUp'].includes(event.key)){event.preventDefault();const list=visibleClips();if(!list.length)return;let index=list.findIndex(c=>c.id===state.selected);index=(index+(event.key==='ArrowDown'?1:-1)+list.length)%list.length;state.selected=list[index].id;const focused=document.activeElement?.getAttribute('aria-label');render();if(focused==='搜索剪贴板记录')screen.querySelector('input')?.focus();return;}
      if(event.key==='Enter'){event.preventDefault();paste(event.shiftKey);}
    }else if(state.tool==='translate'&&event.ctrlKey&&event.key==='Enter'){event.preventDefault();state.translated=!!state.source.trim();render();if(!state.translated)toast('请输入需要翻译的文字');}
  });
  // 坐标仅属于示例桌面；拖动选区不会触发真实屏幕捕获。
  let drag=null;
  root.addEventListener('pointerdown',event=>{
    const layer=event.target.closest('.qw-capture');if(!layer||event.target.closest('button')||state.captureDone)return;
    const rect=stage.getBoundingClientRect();drag={x:event.clientX-rect.left,y:event.clientY-rect.top,rect,layer};layer.setPointerCapture(event.pointerId);
  });
  root.addEventListener('pointermove',event=>{
    if(!drag)return;const x=Math.max(5,Math.min(drag.rect.width-5,event.clientX-drag.rect.left));const y=Math.max(60,Math.min(drag.rect.height-100,event.clientY-drag.rect.top));const selection=screen.querySelector('.qw-selection');if(!selection)return;
    const width=Math.abs(x-drag.x),height=Math.abs(y-drag.y);if(width<5&&height<5)return;
    Object.assign(selection.style,{left:Math.min(x,drag.x)+'px',top:Math.min(y,drag.y)+'px',width:Math.max(8,width)+'px',height:Math.max(8,height)+'px'});
    selection.querySelector('.qw-dimensions').textContent=`${Math.round(width)} × ${Math.round(height)}`;
  });
  root.addEventListener('pointerup',()=>{
    if(!drag)return;state.captureStyle=screen.querySelector('.qw-selection')?.getAttribute('style')||'';drag=null;state.captureDone=true;render();
  });
  // 忽略本次操作的状态回传，防止宿主回显打断截图选区和输入焦点。
  window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent;if(next&&tools.some(t=>t[0]===next.tool)&&(next.tool!==state.tool||next.surface!==state.surface)){state.tool=next.tool;state.surface=['main','quick','closed'].includes(next.surface)?next.surface:'quick';state.capturing=state.tool==='capture'&&state.surface==='quick';render();}});
  render();
  if(globalThis.Tweak){const design={radius:17,row:62};const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--w-radius',design.radius+'px');root.style.setProperty('--w-row',design.row+'px');}});tweak.addSlider(design,'radius',{label:'面板圆角',min:10,max:22,unit:'px'});tweak.addSlider(design,'row',{label:'快捷列表行高',min:50,max:72,unit:'px'});}
})();
</script>
