<script>
(function () {
  'use strict';
  const root = document.getElementById('qbox-directions');

    {name:'设计参考资料',path:'D:\\Design\\设计参考资料',kind:'文件夹',icon:'folder'},
    {name:'QBox 使用说明.pdf',path:'D:\\Documents\\QBox 使用说明.pdf',kind:'PDF 文档',icon:'file-text'},

  ];
  const products = [];
  const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));

  const sampleFoot = '<span>交互预览 · 示例数据</span>';
  function highlightName(name, query) {
    const offset = query ? name.toLowerCase().indexOf(query.toLowerCase()) : -1;
    return offset < 0 ? escapeHtml(name) : escapeHtml(name.slice(0,offset)) + '<mark>' + escapeHtml(name.slice(offset,offset + query.length)) + '</mark>' + escapeHtml(name.slice(offset + query.length));
  }
  const codeHtml = '<pre><span class="qb-code-comment">// 唤醒后先恢复外设，再继续任务</span>\n<span class="qb-code-key">if</span> (device.isAwake) {\n  restorePeripherals();\n  resumePendingTasks();\n}</pre>';
  function icons() { if (globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:18,height:18}}); }

  function save() {
    if (window.openai && window.openai.setWidgetState) {
      const views = {};
      products.forEach(product => { views[product.design] = {module:product.state.module,expanded:product.state.expanded}; });

    }
  }
  function head(product, title, description, actions) {
    const captions = {native:'QBOX / 工具工作台',dark:'QBOX / AT YOUR COMMAND',classic:'QBOX'};

  }
  function footer(left) { return '<div class="qb-bottom"><span>' + left + '</span>' + sampleFoot + '</div>'; }

    const target = product.el.querySelector('.qb-message');

    icons();
  }
  function clipboardView(product) {
    const s = product.state;
    const pause = button(s.paused ? '继续记录' : '暂停记录','pause',s.paused ? 'play' : 'pause');
    const filters = ['全部','文字','图片','文件','收藏'];
    return head(product,'剪贴板','找回刚刚复制的内容，接着用。',pause) +

      '<div class="qb-filters" aria-label="剪贴板类型">' + filters.map(filter => '<button class="qb-filter" type="button" data-filter="' + filter + '" aria-pressed="' + (s.filter === filter) + '">' + filter + '</button>').join('') + '</div>' +
      '<div class="qb-clipboard"><div class="qb-clip-list"></div><div class="qb-preview"></div></div>' +
      footer(icon(s.paused ? 'pause' : 'shield-check') + (s.paused ? '记录已暂停' : '仅保存在此设备'));
  }
  function renderClipResults(product) {
    const s = product.state;
    const matches = clips.filter(clip => (s.filter === '全部' || s.filter === clip.type || s.filter === '收藏' && s.pins[clip.id]) && (clip.title + clip.content + clip.source).toLowerCase().includes(s.clipQuery.toLowerCase()));
    if (!matches.some(clip => clip.id === s.selectedClip)) s.selectedClip = matches[0] ? matches[0].id : '';
    product.el.querySelector('.qb-clip-list').innerHTML = '<div class="qb-section-label" style="padding-left:10px">今天 · ' + matches.length + ' 条</div>' + (matches.length ? matches.map(clip => '<button type="button" class="qb-item" data-clip="' + clip.id + '" aria-pressed="' + (clip.id === s.selectedClip) + '"><span class="qb-item-icon">' + icon(clip.icon) + '</span><span class="qb-item-content"><span class="qb-item-title">' + escapeHtml(clip.title) + '</span><span class="qb-item-meta">' + clip.source + ' · ' + clip.time + '</span></span>' + (s.pins[clip.id] ? icon('pin') : '') + '</button>').join('') : '<div class="qb-empty"><strong>没有找到这条记录</strong>换个关键词，或切换内容类型。</div>');

    if (!selected) { preview.innerHTML = '<div class="qb-empty">选择记录后在这里预览</div>'; icons(); return; }
    let content = escapeHtml(selected.content).replace(/\n/g,'<br>');

    if (selected.type === '图片') content = '<div class="qb-inline-image"><strong>QBox 界面草案</strong><div class="qb-image-bars"><span></span><span></span><span></span></div><p class="qb-small" style="margin-top:15px">让常用工具触手可及</p></div><span class="qb-small">1280 × 720 · PNG</span>';
    if (selected.type === '文件') content = '<div style="display:flex;gap:12px;align-items:center">' + icon('file-text') + '<div><strong>需求说明.pdf</strong><div class="qb-small">PDF 文档 · 248 KB</div></div></div><p class="qb-small" style="margin-top:20px">D:\\Documents\\需求说明.pdf</p>';
    preview.innerHTML = '<div class="qb-preview-top"><span>' + selected.type + '预览</span><button type="button" class="qb-button qb-ghost" data-action="pin" aria-label="' + (s.pins[selected.id] ? '取消收藏' : '收藏') + '">' + icon(s.pins[selected.id] ? 'pin-off' : 'pin') + '</button></div><div class="qb-preview-content">' + content + '</div><div class="qb-actions">' + button('复制','copy','copy',true) + button(selected.type === '图片' ? '贴到屏幕' : '纯文本','plain',selected.type === '图片' ? 'pin' : 'text') + (selected.type === '文字' ? button('翻译','clip-translate','languages') : '') + '</div><div class="qb-preview-info"><span>' + selected.source + '</span><span>' + selected.time + '</span></div>';
    icons();
  }
  function searchView(product) {
    const s = product.state;

      '<label class="qb-search-field">' + icon('search') + '<input data-input="files" aria-label="搜索文件和应用" value="' + escapeHtml(s.fileQuery) + '" placeholder="搜索文件、文件夹和应用…"><kbd>Enter</kbd></label>' +
      '<div class="qb-filters"><button type="button" class="qb-filter" aria-pressed="true" data-file-filter="all">文件与应用</button><button type="button" class="qb-filter" aria-pressed="false" data-action="commands">工具动作</button></div><div class="qb-file-results"></div>' +
      footer('<kbd>↑</kbd><kbd>↓</kbd> 选择　<kbd>Enter</kbd> 打开　<kbd>Esc</kbd> 收起');
  }
  function renderFiles(product) {
    const s = product.state;
    product.el.querySelector('[data-file-filter="all"]').setAttribute('aria-pressed','true');

    icons();
  }
  function commandResults(product) {
    product.state.commandMode = true;
    product.el.querySelector('[data-file-filter="all"]').setAttribute('aria-pressed','false');

      {id:'capture',label:'截取屏幕区域',detail:'直接进入框选与标注',icon:'scan'},
      {id:'clipboard',label:'打开剪贴板历史',detail:'查找文字、图片和文件',icon:'clipboard'},
      {id:'translate',label:'快速翻译',detail:'输入文字，或从截图提取',icon:'languages'},
      {id:'desktop',label:'整理桌面',detail:'查看分组与归档预览',icon:'panels-top-left'}
    ].map(item => '<button class="qb-item" type="button" data-module="' + item.id + '"><span class="qb-item-icon">' + icon(item.icon) + '</span><span class="qb-item-content"><span class="qb-item-title">' + item.label + '</span><span class="qb-item-meta">' + item.detail + '</span></span>' + icon('arrow-up-right') + '</button>').join('') + '</div>';
    icons();
  }
  function captureView(product) {
    const tools = [['mouse-pointer-2','选择'],['square','矩形'],['arrow-up-right','箭头'],['pencil','画笔'],['type','文字'],['grid-2x2','马赛克']];

      '<div class="qb-capture"><div class="qb-capture-doc"><div class="qb-document-title">QBox · 产品设计笔记</div><div class="qb-document-meta">界面探索 / 工作记录</div><div class="qb-capture-selection"><strong>Keep the tools close.</strong><p>A quiet workspace helps you focus on the task at hand.</p></div></div><div class="qb-capture-tools" aria-label="截图标注工具">' + tools.map((tool,index) => '<button type="button" class="qb-tool" data-annotation="' + tool[1] + '" aria-label="' + tool[1] + '" aria-pressed="' + (index === 0) + '">' + icon(tool[0]) + '</button>').join('') + '<span class="qb-divider"></span>' + button('复制','copy-image','copy',true) + '</div></div>' +

      footer(icon('image') + '区域截图 · 640 × 240');

  function translationView(product) {

    const s = product.state;
    product.el.dataset.active = s.module;
    const views = {search:searchView,clipboard:clipboardView,capture:captureView,desktop:desktopView,translate:translationView,settings:settingsView};
    product.el.querySelector('.qb-main').innerHTML = views[s.module](product) + '<div class="qb-message" aria-live="polite"></div>';
    product.el.querySelectorAll('[data-module]').forEach(el => el.setAttribute('aria-pressed',String(el.dataset.module === s.module)));
    if (s.module === 'clipboard') renderClipResults(product);
    if (s.module === 'search') renderFiles(product);
    icons();
  }
  function renderShell(product) {
    const s = product.state;
    const nav = modules.map(item => navItem(item,s.module)).join('');
    const settings = navItem({id:'settings',label:'设置',icon:'settings-2'},s.module);
    const windowActions = '<div class="qb-window-actions" aria-hidden="true"><span>' + icon('minus') + '</span><span>' + icon('square') + '</span><span>' + icon('x') + '</span></div>';
    if (product.design === 'native') product.el.innerHTML = '<div class="qb-titlebar"><div class="qb-brand"><span class="qb-logo">Q</span>QBox <span class="qb-small" style="font-weight:400;margin-left:7px">工具在手边</span></div>' + windowActions + '</div><div class="qb-shell"><nav class="qb-sidebar" aria-label="工具导航"><div class="qb-nav-caption">常用工具</div>' + nav + '<div class="qb-nav-bottom">' + settings + '<div class="qb-sidebar-foot">QBox · 界面概念</div></div></nav><main class="qb-main"></main></div>';
    if (product.design === 'dark') product.el.innerHTML = '<div class="qb-command-head"><div class="qb-brand"><span class="qb-logo">Q</span>QBox<span class="qb-command-caption">A LITTLE MORE FOCUS.</span></div><div class="qb-actions">' + button('设置','go-settings','settings-2') + '</div></div><nav class="qb-topnav" aria-label="工具导航">' + nav + '</nav><main class="qb-main"></main>';
    if (product.design === 'classic') product.el.innerHTML = '<div class="qb-compact-head"><span class="qb-logo">Q</span><span class="qb-compact-label">QBOX</span><span class="qb-small">文件 · 应用 · 工具</span><div class="qb-actions">' + button(s.expanded ? '收起' : '展开','expand',s.expanded ? 'chevrons-down' : 'chevrons-up') + '<button class="qb-button qb-ghost" type="button" data-action="go-settings" aria-label="打开设置">' + icon('settings-2') + '</button></div></div><nav class="qb-compact-nav" aria-label="工具导航">' + nav + '</nav><main class="qb-main"></main>';
    product.el.dataset.expanded = String(s.expanded);
    renderMain(product);
  }
  function changeModule(product, id) { product.state.module = id; product.state.commandMode = false; renderMain(product); save(); }
  function organizePreview(product) {
    const target = product.el.querySelector('.qb-organize-plan');
    target.innerHTML = '<div class="qb-plan"><strong>本次归档预览</strong><div class="qb-plan-line"><span>需求说明.pdf</span><span>桌面 / 文档</span></div><div class="qb-plan-line"><span>参考截图.png</span><span>桌面 / 图片</span></div><div class="qb-actions">' + button('确认整理 2 项','confirm-organize','check',true) + button('取消','cancel-organize','x') + '</div></div>';
    icons();
  }
  const saved = window.openai && window.openai.widgetState && window.openai.widgetState.privateContent ? window.openai.widgetState.privateContent.qboxViews || {} : {};
  root.querySelectorAll('.qb-product').forEach(el => {
    const design = el.dataset.design;
    const prior = saved[design] || {};
    const product = {el:el,design:design,state:{module:prior.module && ['search','clipboard','capture','desktop','translate','settings'].includes(prior.module) ? prior.module : design === 'native' ? 'clipboard' : 'search',expanded:Boolean(prior.expanded),clipQuery:'',filter:'全部',selectedClip:'code',pins:{code:true,file:true},paused:false,fileQuery:design === 'classic' ? '资料' : '',selectedFile:0,commandMode:false,translationInput:'Keep the tools close, and the workspace clear.',translationOutput:''}};
    products.push(product);
    renderShell(product);
    // 三个方案各自保存局部操作状态，切换外观不会改写系统剪贴板或真实文件。
    el.addEventListener('click',function (event) {
      const control = event.target.closest('button');
      if (!control || !el.contains(control)) return;
      const s = product.state;
      if (control.dataset.module) { changeModule(product,control.dataset.module); return; }
      if (control.dataset.filter) { s.filter = control.dataset.filter; renderMain(product); return; }
      if (control.dataset.clip) { s.selectedClip = control.dataset.clip; renderClipResults(product); return; }
      if (control.dataset.file !== undefined) { s.selectedFile = Number(control.dataset.file); renderFiles(product); return; }
      if (control.dataset.fileFilter) { s.commandMode = false; control.setAttribute('aria-pressed','true'); el.querySelector('.qb-filters [data-action="commands"]').setAttribute('aria-pressed','false'); renderFiles(product); return; }
      if (control.dataset.annotation) { el.querySelectorAll('[data-annotation]').forEach(item => item.setAttribute('aria-pressed',String(item === control))); toast(product,'已选择' + control.dataset.annotation + '工具'); return; }
      if (control.dataset.setting) { control.setAttribute('aria-pressed',String(control.getAttribute('aria-pressed') !== 'true')); return; }
      const action = control.dataset.action;
      if (action === 'dismiss') { el.querySelector('.qb-message').innerHTML = ''; return; }
      if (action === 'pause') { s.paused = !s.paused; renderMain(product); return; }
      if (action === 'pin') { s.pins[s.selectedClip] = !s.pins[s.selectedClip]; renderClipResults(product); return; }
      if (action === 'copy') { toast(product,'已复制这条示例内容'); return; }
      if (action === 'plain') { toast(product,clips.find(clip => clip.id === s.selectedClip).type === '图片' ? '示例图片已置顶，可在当前任务旁对照' : '已复制为纯文本'); return; }
      if (action === 'clip-translate') { s.translationInput = clips.find(clip => clip.id === s.selectedClip).content; s.translationOutput = '这条记录会送入翻译面板，可继续选择目标语言。'; changeModule(product,'translate'); return; }
      if (action === 'commands') { commandResults(product); return; }
      if (action === 'open-file') { toast(product,'已提交打开请求（原型演示）'); return; }
      if (action === 'copy-path') { toast(product,'已复制所选示例路径'); return; }
      if (action === 'go-settings') { changeModule(product,'settings'); return; }
      if (action === 'expand') { s.expanded = !s.expanded; renderShell(product); save(); return; }
      if (action === 'new-capture') { toast(product,'进入区域框选 → 标注 → 复制或保存（流程预览）'); return; }
      if (action === 'copy-image') { toast(product,'示例截图已复制'); return; }
      if (action === 'stick' || action === 'stick-translation') { toast(product,'已置顶，可留在当前任务旁参考（原型演示）'); return; }
      if (action === 'save-image') { toast(product,'保存截图时选择位置与格式（原型演示）'); return; }
      if (action === 'ocr') { el.querySelector('.qb-ocr-output').innerHTML = '<div class="qb-text-output"><span class="qb-small">识别出的文字</span><p>Keep the tools close. A quiet workspace helps you focus on the task at hand.</p><div class="qb-actions" style="margin-top:12px">' + button('复制文字','copy','copy') + button('翻译','capture-translate','languages') + '</div></div>'; icons(); return; }
      if (action === 'capture-translate' || action === 'translate-capture') { s.translationInput = 'Keep the tools close. A quiet workspace helps you focus on the task at hand.'; s.translationOutput = '让工具触手可及。清爽的工作空间能帮助你专注于眼前的任务。'; changeModule(product,'translate'); return; }
      if (action === 'clear-translation') { s.translationInput = ''; s.translationOutput = '译文会显示在这里'; el.querySelector('[data-input="translation"]').value = ''; el.querySelector('.qb-translation').textContent = s.translationOutput; el.querySelector('.qb-translation-error').textContent = ''; return; }
      if (action === 'copy-translation') { toast(product,'已复制示例译文'); return; }
      if (action === 'translate-now') {
        const error = el.querySelector('.qb-translation-error');
        if (!s.translationInput.trim()) { error.textContent = '请先输入要翻译的文字。'; return; }
        error.textContent = ''; control.disabled = true; control.textContent = '正在翻译…';
        const target = el.querySelector('.qb-translation');
        target.textContent = '正在翻译…';
        setTimeout(function () {
          if (!el.contains(target)) return;
          const source = s.translationInput.toLowerCase();
          s.translationOutput = source.includes('quiet workspace') ? '让工具触手可及。清爽的工作空间能帮助你专注于眼前的任务。' : source.includes('keep the tools') ? '让工具触手可及，让工作空间保持清爽。' : '这里将展示所选引擎的译文。当前原型只演示翻译流程。';
          target.textContent = s.translationOutput; control.disabled = false; control.innerHTML = icon('languages') + '翻译'; icons();
        },650);
        return;
      }
      if (action === 'preview-organize') { organizePreview(product); return; }
      if (action === 'cancel-organize') { el.querySelector('.qb-organize-plan').innerHTML = ''; return; }
      if (action === 'confirm-organize') { el.querySelector('.qb-organize-plan').innerHTML = '<div class="qb-toast" role="status"><span>已整理 2 项 · 原型演示</span>' + button('撤销','undo-organize','undo-2') + '</div>'; icons(); return; }
      if (action === 'undo-organize') { el.querySelector('.qb-organize-plan').innerHTML = ''; toast(product,'已恢复整理前的位置（原型演示）'); return; }
      if (action === 'desktop-groups') { renderMain(product); return; }
      if (action === 'organize-rules') {
        control.setAttribute('aria-pressed','true'); el.querySelector('[data-action="desktop-groups"]').setAttribute('aria-pressed','false');
        el.querySelector('.qb-desktop-content').innerHTML = '<div class="qb-plan"><strong>按文件类型归档</strong><div class="qb-settings-row"><div>图片<span class="qb-small">PNG、JPG、WebP → 桌面 / 图片</span></div><button class="qb-toggle" type="button" data-setting="images" aria-label="启用图片归档" aria-pressed="true"></button></div><div class="qb-settings-row"><div>文档<span class="qb-small">PDF、DOCX、TXT → 桌面 / 文档</span></div><button class="qb-toggle" type="button" data-setting="documents" aria-label="启用文档归档" aria-pressed="true"></button></div><p class="qb-small" style="padding-top:15px">未命中规则的文件保留原位。</p></div>';
        el.querySelector('.qb-organize-plan').innerHTML = ''; return;
      }
    });
    el.addEventListener('input',function (event) {
      const field = event.target.dataset.input;
      if (field === 'clips') { product.state.clipQuery = event.target.value; renderClipResults(product); }
      if (field === 'files') { product.state.fileQuery = event.target.value; product.state.selectedFile = 0; product.state.commandMode = false; renderFiles(product); }
      if (field === 'translation') product.state.translationInput = event.target.value;
    });
    el.addEventListener('keydown',function (event) {
      const s = product.state;
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') { const input = el.querySelector('.qb-search-field input'); if (input) { event.preventDefault(); input.focus(); input.select(); } }
      if (event.target.matches('[data-input="files"]') && (event.key === 'ArrowDown' || event.key === 'ArrowUp')) {
        const count = el.querySelectorAll('[data-file]').length;
        if (!count) return;
        event.preventDefault(); s.selectedFile = (s.selectedFile + (event.key === 'ArrowDown' ? 1 : -1) + count) % count; renderFiles(product);
      }
      if (event.target.matches('[data-input="files"]') && event.key === 'Enter') { event.preventDefault(); if (el.querySelector('[data-file]')) toast(product,'已提交打开请求（原型演示）'); }
    });
    if (globalThis.Tweak) {
      const appearance = {radius:design === 'native' ? 12 : design === 'dark' ? 16 : 10,spacing:'舒适'};
      const tweak = new globalThis.Tweak({container:el,onChange:function () { el.style.setProperty('--q-radius',appearance.radius + 'px'); el.style.setProperty('--q-row',appearance.spacing === '紧凑' ? '60px' : '72px'); }});
      tweak.addSlider(appearance,'radius',{label:'窗口圆角',min:4,max:20,unit:'px'});
      tweak.addSelect(appearance,'spacing',{label:'列表密度',options:['舒适','紧凑']});
    }
  });
  window.addEventListener('openai:set_globals',function (event) {
    const state = event.detail && event.detail.globals && event.detail.globals.widgetState;
    const views = state && state.privateContent && state.privateContent.qboxViews;
    if (!views) return;
    products.forEach(product => {
      const next = views[product.design];
      if (next && ['search','clipboard','capture','desktop','translate','settings'].includes(next.module)) {
        product.state.module = next.module; product.state.expanded = Boolean(next.expanded); renderShell(product);
      }
    });
  });
})();
</script>
